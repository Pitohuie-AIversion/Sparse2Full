experiment:
  name: "AR-DR2D-10M-Crop"
  description: "Crop观测配置 - 与SRx4实验保持一致的数据设定"
  device: cuda
  seed: 2025
  seeds: [2025, 2026, 2027]
  output_dir: runs
  log_every_n_steps: 10

device:
  accelerator: cuda
  devices: 1
  strategy: null
  allow_data_parallel_fallback: true
  precision: bf16-mixed

ar:
  enabled: false

sequential:
  enabled: false

data:
  data_path: "data/DR2D/2D_diff-react_NA_NA.h5"
  dataset_name: RealDiffusionReaction
  img_size: 128
  keys: ["data"]
  component: u
  use_official_format: true
  splits_dir: splits
  target_channels: 1
  input_channels: 1
  sample_limit: null

  T_in: 1
  T_out: 1

  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  time_step_start: 0
  time_step_end: 101
  time_step_stride: 10

  observation:
    mode: Crop
    crop_ratio: 0.5          # 约 64x64 裁剪窗口
    boundary_mode: mirror

  input_mode: lr
  include_coords: true
  include_mask: true
  include_fourier_pe: false
  fourier_pe_bands: 4

  normalize: true
  augmentation:
    enabled: false
    flip_prob: 0.0
    rotate_prob: 0.0
    noise_std: 0.0

  dataloader:
    batch_size: 96
    val_batch_size: 96
    test_batch_size: 96
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
    drop_last: true
    shuffle: true
    timeout: 60

hardware:
  allow_tf32: true
  memory:
    cudnn_benchmark: true

model:
  name: SwinTWithEncoder
  in_channels: 4
  out_channels: 1
  img_size: 128
  encoder_out_channels: 8
  embed_dim: 48
  depths: [2, 2, 6, 2]
  num_heads: [3, 6, 12, 24]
  patch_size: 4
  window_size: 8
  mlp_ratio: 4.0
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  qkv_bias: true
  qk_scale: null
  norm_layer: LayerNorm
  ape: false
  patch_norm: true
  use_checkpoint: false
  final_upsample: expand_first
  post_conv3x3: true

model_budget:
  target_params_m: 10.0
  tolerance_m: 0.5
  auto_tune: true

training:
  epochs: 5
  batch_size: 96
  gradient_accumulation_steps: 1

  torch_compile: false
  torch_compile_backend: "inductor"
  torch_compile_mode: "reduce-overhead"
  channels_last: true

  dataloader:
    batch_size: 96
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4

  loss_weights:
    reconstruction: 1.0
    spectral: 0.5
    data_consistency: 1.0

  validation:
    enabled: true
    check_val_every_n_epoch: 1
    save_val_batch_for_viz: false
    log_val_metrics: false

  optimizer:
    name: "AdamW"
    lr: 0.0005
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1e-8
    fused: false
    foreach: false

  scheduler:
    name: "CosineAnnealingLR"
    T_max: 100
    eta_min: 1e-6
    warmup_epochs: 5

  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

  amp:
    enabled: false
    autocast_dtype: bfloat16

  curriculum:
    enabled: false
    stages: []

  checkpoint:
    save_best: true
    save_last: true
    max_keep: 3
    monitor: val_loss
    mode: min
    save_every_n_epochs: 5

  early_stopping:
    enabled: false
    patience: 20
    monitor: val_loss
    mode: min
    min_delta: 1e-6

loss:
  ar_loss:
    weight: 0.0
    reduction: mean

  reconstruction:
    weight: 1.0
  spectral:
    weight: 0.0
  degradation_consistency:
    weight: 0.0
  gradient_weight: 0.0

validation:
  check_val_every_n_epoch: 1
  use_observation: true

  metrics:
    - rel_l2
    - mae
    - psnr
    - ssim

  rollout_steps: [1]

  convergence_criteria:
    target_rel_l2: 0.1
    patience_for_convergence: 10
    min_improvement: 1e-4

logging:
  experiment_name: "AR-DR2D-10M-Crop"
  version: null
  default_hp_metric: false

