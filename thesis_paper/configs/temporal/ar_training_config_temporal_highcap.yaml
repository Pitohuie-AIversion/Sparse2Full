experiment:
  name: "AR-DR2D-TemporalAR-Tin12-dim512-tf50-s2025"
  description: "自回归预测（时序高容量设置）"
  device: cuda
  seed: 2025
  output_dir: runs
  log_every_n_steps: 5

device:
  accelerator: cuda
  devices: 1
  strategy: none
  allow_data_parallel_fallback: true
  precision: fp32

ar:
  enabled: true

sequential:
  enabled: true
  model_type: "SequentialSpatiotemporalModel"
  spatial:
    in_channels: 1
    spatial_feature_dim: 128
    out_channels: 1
    img_size: [128, 128]
    backbone_type: "fno2d"
    backbone_config:
      modes1: 12
      modes2: 12
      width: 64
      n_layers: 4
      activation: 'gelu'
  temporal:
    spatial_feature_dim: 128
    temporal_dim: 256
    out_channels: 1
    img_size: [128, 128]
    num_heads: 8
    num_layers: 4
    dropout: 0.1
    use_positional_encoding: true
    reduce_spatial: avg_pool
    reduce_size: [16, 16]
    teacher_forcing_cap: 0.5

consistency:
  enabled: true
  spatial_temporal_consistency: true
  feature_consistency_weight: 0.3

model_wrapper:
  enabled: false

model:
  name: fno2d
  in_channels: 1
  out_channels: 1
  img_size: 128
  modes1: 12
  modes2: 12
  width: 64
  n_layers: 4
  activation: 'gelu'

data:
  data_path: "data/DR2D/2D_diff-react_NA_NA.h5"
  dataset_name: RealDiffusionReaction
  img_size: 128
  keys: ["data"]
  component: u
  use_official_format: true
  splits_dir: splits
  target_channels: 1
  input_channels: 1
  sample_limit: 100
  T_in: 8
  T_out: 1
  train_ratio: 0.8
  val_ratio: 0.15
  test_ratio: 0.05
  time_step_start: 0
  time_step_end: 50
  time_step_stride: 1
  observation:
    mode: identity
    use_coords: false
    use_mask: false
  normalize: true
  augmentation:
    enabled: false
  use_synthetic_data: false
  synthetic_data_config:
    num_samples: 1000
    image_size: 128
    channels: 2
  dataloader:
    batch_size: 32
    val_batch_size: 64
    test_batch_size: 64
    num_workers: 0
    pin_memory: false
    persistent_workers: false
    prefetch_factor: 2
    drop_last: false
    shuffle: true
    timeout: 0

hardware:
  allow_tf32: false
  memory:
    cudnn_benchmark: false
  torch_threads: 96
  mkl_threads: 96
  omp_threads: 96
  interop_threads: 96
  blas_threads: 96
  numexpr_threads: 96
  vram_threshold: 0.98

training:
  epochs: 100
  batch_size: 8
  gradient_accumulation_steps: 4
  torch_compile: false
  torch_compile_backend: "inductor"
  torch_compile_mode: "reduce-overhead"
  channels_last: true
  dataloader:
    batch_size: 8
  rollout_training: true
  teacher_forcing_cap: 0.5
  loss_weights:
    reconstruction: 0.0
    spectral: 0.0
    data_consistency: 0.0
    derivative_consistency: 0.1
    energy_consistency: 0.05
  validation:
    enabled: true
    check_val_every_n_epoch: 5
    save_val_batch_for_viz: false
    log_val_metrics: true
  optimizer:
    name: "AdamW"
    lr: 0.0002
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1e-8
    fused: false
    foreach: false
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 1045
    eta_min: 1e-6
    warmup_epochs: 5
  distributed:
    enabled: false
    backend: "gloo"
    init_method: "env://"
  gradient_clip_val: 0.1
  gradient_clip_algorithm: norm
  amp:
    enabled: true
    autocast_dtype: float16
  curriculum:
    enabled: false
  checkpoint:
    save_best: true
    save_last: true
    max_keep: 3
    monitor: val_loss
    mode: min
    save_every_n_epochs: 10
  early_stopping:
    enabled: false
    patience: 50
    monitor: val_loss
    mode: min
    min_delta: 1e-4

loss:
  ar_loss:
    weight: 0.0
    reduction: mean
  reconstruction:
    weight: 0.0
  spectral:
    weight: 0.0
  degradation_consistency:
    weight: 0.0
  gradient_weight: 0.0
  r2:
    weight: 1.0
    reduction: mean
  rel2_weight: 1.0
  mae_weight: 0.0

validation:
  check_val_every_n_epoch: 5
  use_observation: false
  metrics:
    - rel_l2
    - mae
    - degradation_consistency
  rollout_steps:
    - 1
    - 3
    - 5
  convergence_criteria:
    target_rel_l2: 0.3
    patience_for_convergence: 5
    min_improvement: 5e-4

logging:
  experiment_name: "AR-DR2D-TemporalAR-Tin12-dim512-tf50-s2025"
  version: null
  default_hp_metric: false
  log_model: false
  performance_monitoring:
    log_gpu_memory: false
    log_throughput: true
    log_batch_time: true
  tensorboard:
    save_dir: runs/tensorboard
    name: ar_training_temporal_highcap
    version: null
  visualization:
    save_samples_every_n_epochs: 50
    num_samples_to_save: 5
    save_training_curves: true
    save_rollout_visualization: false

visualization:
  save_test_visualizations: true

seed: 2025

testing:
  enabled: false
  run_final_test: false
  save_predictions: false
  compute_detailed_metrics: false
  batch_size: 64
  save_visualizations: true
  num_visualization_samples: 2
  fast_mode: false
  skip_complex_metrics: false
  minimal_logging: false

data_augmentation:
  enable: false
  random_rotation:
    enable: false
  random_flip:
    enable: false
  gaussian_noise:
    enable: false
  normalize_per_sample: false
  compute_statistics: false
