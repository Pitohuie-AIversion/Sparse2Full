# AR Training Configuration - ConvLSTM Horizontal Comparison on DR2D
# Task: Horizontal comparison of ConvLSTM (RNN) vs VideoSwin (Transformer)
# Dataset: DR2D (RealDiffusionReaction)
# Mode: Pure Temporal (Identity Spatial)

experiment:
  name: "AR-DR2D-ConvLSTM-HorizontalComparison-s2025"
  description: "Horizontal comparison: ConvLSTM on DR2D (Pure Temporal)"
  device: cuda
  seed: 2025
  output_dir: runs
  log_every_n_steps: 5

device:
  accelerator: cuda
  devices: 2
  strategy: ddp
  allow_data_parallel_fallback: true
  precision: fp32

ar:
  enabled: true

sequential:
  enabled: true
  model_type: "SequentialSpatiotemporalModel"
  spatial:
    in_channels: 1
    spatial_feature_dim: 0
    out_channels: 1
    img_size: [128, 128]
    backbone_type: "identity"
    backbone_config:
      modes1: 12
      modes2: 12
      width: 64
      n_layers: 4
      activation: 'gelu'
  temporal:
    spatial_feature_dim: 0
    temporal_dim: 46
    out_channels: 1
    img_size: [128, 128]
    backend: conv_rnn
    hidden_channels: 46
    num_layers: 2
    kernel_size: 3
    dropout: 0.1
    teacher_forcing_cap: 0.0
    teacher_forcing_schedule:
      enabled: false
  
  consistency:
    enabled: true
    spatial_temporal_consistency: true
    feature_consistency_weight: 0.3

  training:
    two_stage_training: false
    stage1_epochs: 0
    stage2_epochs: 200
    spatial_loss_weight: 0.0
    temporal_loss_weight: 1.0
    teacher_forcing_cap: 0.2

model_wrapper:
  enabled: false

data:
  data_path: "/share/fandixiaLab/suguangsheng/PycharmProjects/Sparse2Full/data/DR2D/2D_diff-react_NA_NA.h5"
  dataset_name: RealDiffusionReaction
  img_size: 128
  channels: 1
  keys: ["data"]
  component: u
  use_official_format: true
  splits_dir: splits
  target_channels: 1
  input_channels: 1
  # sample_limit: null # Use full dataset for real comparison
  sample_limit: 1000 # Use 1000 samples for a reasonable experiment runtime
  
  T_in: 16
  T_out: 4
  
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  
  time_step_start: 0
  time_step_end: 101
  time_step_stride: 1
  
  observation:
    mode: identity
    use_coords: false
    use_mask: false
  
  normalize: true
  augmentation:
    enabled: false

  use_synthetic_data: false
  
  dataloader:
    batch_size: 64
    val_batch_size: 64
    test_batch_size: 64
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: false
    shuffle: true
    timeout: 0

hardware:
  allow_tf32: false
  memory:
    cudnn_benchmark: false
  torch_threads: 16
  mkl_threads: 16
  omp_threads: 16

training:
  epochs: 200
  batch_size: 64
  gradient_accumulation_steps: 1
  
  torch_compile: false
  channels_last: true
  
  dataloader:
    batch_size: 8
  rollout_training: true
  teacher_forcing_cap: 0.5
  
  loss_weights:
    reconstruction: 1.0
    spectral: 0.02
    data_consistency: 0.0
    derivative_consistency: 0.0
    energy_consistency: 0.0

  loss:
    rel2_weight: 1.0
    mae_weight: 0.1
  
  validation:
    enabled: true
    check_val_every_n_epoch: 5
    save_val_batch_for_viz: false
    log_val_metrics: true
  
  optimizer:
    name: "AdamW"
    lr: 0.001
    weight_decay: 0.0001
  
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 200
    eta_min: 1e-6
    warmup_epochs: 5
  
  distributed:
    enabled: false
  
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  
  amp:
    enabled: true
    autocast_dtype: float16
  
  curriculum:
    enabled: false
  
  checkpoint:
    save_best: true
    save_last: true
    max_keep: 3
    monitor: val_loss
    mode: min
    save_every_n_epochs: 10
  
  early_stopping:
    enabled: false

validation:
  check_val_every_n_epoch: 5
  use_observation: false
  
  metrics:
    - rel_l2
    - mae
  
  rollout_steps: [1, 4]
  
  convergence_criteria:
    target_rel_l2: 0.3
    patience_for_convergence: 5
    min_improvement: 5e-4

logging:
  experiment_name: "AR-DR2D-ConvLSTM-HorizontalComparison-s2025"
  version: null
  default_hp_metric: false
  log_model: false
  
  performance_monitoring:
    log_gpu_memory: false
    log_throughput: true
    log_batch_time: true
  
  tensorboard:
    save_dir: runs/tensorboard
    name: ar_training_convlstm_dr2d
    version: null
  save_splits_snapshot: true
  
  visualization:
    save_samples_every_n_epochs: 20
    num_samples_to_save: 5
    save_training_curves: true
    save_rollout_visualization: false

seed: 2025

testing:
  enabled: true
  run_final_test: true
  save_predictions: false
  compute_detailed_metrics: false
  batch_size: 8
  save_visualizations: true
  num_visualization_samples: 2
  fast_mode: false

data_augmentation:
  enable: false
