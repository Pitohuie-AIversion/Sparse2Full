experiment:
  name: "AR-DR2D-10M-300ep-smoke"
  description: "Smoke test for paper-aligned config (short run)"
  device: cpu
  seed: 2025
  output_dir: runs
  log_every_n_steps: 1

device:
  accelerator: cpu
  devices: 1
  strategy: auto
  allow_data_parallel_fallback: true
  precision: bf16-mixed

ar:
  enabled: false

sequential:
  enabled: false

data:
  data_path: "/share/fandixiaLab/suguangsheng/PycharmProjects/Sparse2Full/data/DR2D/2D_diff-react_NA_NA.h5"
  dataset_name: RealDiffusionReaction
  img_size: 128
  keys: ["data"]
  component: u
  use_official_format: true
  splits_dir: splits
  target_channels: 1
  input_channels: 1
  sample_limit: 16
  T_in: 1
  T_out: 1
  time_step_start: 0
  time_step_end: 5
  time_step_stride: 1
  observation:
    mode: SR
    sr:
      scale_factor: 2
      blur_sigma: 1.0
      blur_kernel_size: 5
      boundary_mode: mirror
      downsample_mode: area
      align_corners: false
      antialias: true
  normalize: true
  dataloader:
    batch_size: 8
    val_batch_size: 8
    test_batch_size: 8
    num_workers: 0
    pin_memory: true
    persistent_workers: false
    prefetch_factor: null
    drop_last: true
    shuffle: true
    timeout: 60

hardware:
  allow_tf32: true
  memory:
    cudnn_benchmark: false

model:
  name: UNet
  in_channels: 1
  out_channels: 1
  img_size: 128

model_budget:
  target_params_m: 10.0
  tolerance_m: 0.5
  auto_tune: true

training:
  epochs: 1
  batch_size: 8
  gradient_accumulation_steps: 1
  torch_compile: false
  channels_last: true
  dataloader:
    batch_size: 8
    num_workers: 0
    pin_memory: true
    persistent_workers: false
    prefetch_factor: null
  loss_weights:
    reconstruction: 1.0
    spectral: 0.5
    data_consistency: 1.0
  validation:
    enabled: true
    check_val_every_n_epoch: 1
    save_val_batch_for_viz: false
    log_val_metrics: true
  optimizer:
    name: "AdamW"
    lr: 0.001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 1e-8
    fused: false
    foreach: false
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 10
    eta_min: 1e-6
    warmup_epochs: 0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  amp:
    enabled: false

loss:
  ar_loss:
    weight: 0.0
    reduction: mean
  reconstruction:
    weight: 1.0
  spectral:
    weight: 0.5
  degradation_consistency:
    weight: 1.0
  gradient_weight: 0.0

validation:
  check_val_every_n_epoch: 1
  use_observation: true
  metrics:
    - rel_l2
    - mae
    - psnr
    - ssim
  rollout_steps: [1]
  convergence_criteria:
    target_rel_l2: 0.9
    patience_for_convergence: 1
    min_improvement: 1e-3

logging:
  experiment_name: "AR-DR2D-10M-300ep-smoke"
  version: null
  default_hp_metric: false
  log_model: false
  performance_monitoring:
    log_gpu_memory: false
    log_throughput: true
    log_batch_time: true
  tensorboard:
    save_dir: runs/tensorboard
    name: ar_paper_smoke
    version: null
  visualization:
    save_samples_every_n_epochs: 1
    num_samples_to_save: 1
    save_training_curves: true
    save_rollout_visualization: false

testing:
  enabled: true
  run_final_test: true
  save_predictions: false
  compute_detailed_metrics: true
  batch_size: 8
  save_visualizations: false
  num_visualization_samples: 0
