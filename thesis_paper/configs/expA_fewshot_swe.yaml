experiment:
  name: expA_fewshot_swe
  description: 跨方程泛化性测试 - Few-shot DRD pretrained model on SWE
  device: cuda
  seed: 2025
  output_dir: runs/expA_fewshot_swe

device:
  accelerator: cuda
  devices: 1
  precision: bf16-mixed

ar:
  enabled: false

data:
  data_path: data/2D/shallow-water/2D_rdb_NA_NA.h5
  dataset_name: ShallowWater
  img_size: 128
  keys:
  - data
  component: u
  use_official_format: true
  splits_dir: splits
  target_channels: 1
  input_channels: 1
  T_in: 1
  T_out: 1
  train_ratio: 0.1 # Few-shot, only 10% for training
  val_ratio: 0.25
  test_ratio: 0.25
  time_step_start: 0
  time_step_end: 101
  time_step_stride: 10
  observation:
    mode: SR
    sr:
      scale_factor: 4
      blur_sigma: 1.0
      blur_kernel_size: 5
      boundary_mode: mirror
      downsample_mode: area
      align_corners: false
      antialias: true
  dataloader:
    batch_size: 16
    num_workers: 4
    val_batch_size: 16
    test_batch_size: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true

model:
  name: edsr
  in_channels: 1
  out_channels: 1
  img_size: 128
  modes1: 16
  modes2: 16
  width: 48
  n_layers: 4
  activation: gelu
  padding: 8

pretrained_path: runs_drd_paper/AR-DR2D-Stage1-EDSR-SRx4-model_EDSR-s2025-20260116/best.ckpt

training:
  epochs: 10
  batch_size: 16
  gradient_clip_val: 1.0
  amp:
    enabled: true
    autocast_dtype: bfloat16
  loss_weights:
    reconstruction: 1.0
    spectral: 0.5
    data_consistency: 1.0
  optimizer:
    name: AdamW
    lr: 1e-4 # smaller lr for fine-tuning
    weight_decay: 1e-4
  scheduler:
    name: CosineAnnealingLR
    T_max: 50
    eta_min: 1e-6
    warmup_epochs: 5
  checkpoint:
    save_best: true
    monitor: val_loss
    mode: min

testing:
  enabled: true
  run_final_test: true
  save_predictions: false
  compute_detailed_metrics: true
  batch_size: 16
  save_visualizations: false
  num_visualization_samples: 3

validation:
  check_val_every_n_epoch: 5
  use_observation: true
  metrics:
  - rel_l2
  - mae
  - psnr
  - ssim
