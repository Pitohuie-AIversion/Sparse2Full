experiment:
  name: "AR-DR2D-Stage1-EDSR-SRx4"
  description: "Stage 1 Spatial Pre-training: EDSR"
  device: cuda
  seed: 2025
  output_dir: "runs_drd_paper/${experiment.name}"

device:
  accelerator: cuda
  devices: 1
  precision: bf16-mixed

ar:
  enabled: false

sequential:
  enabled: false # 禁用 Sequential，直接用标准 Trainer 跑 EDSR

data:
  data_path: "/share/fandixiaLab/suguangsheng/PycharmProjects/Sparse2Full/data/DR2D/2D_diff-react_NA_NA.h5"
  dataset_name: RealDiffusionReaction
  img_size: 128
  keys: ["data"]
  component: u
  use_official_format: true
  splits_dir: splits
  target_channels: 1
  input_channels: 1
  
  # Stage 1 关键配置：一对一训练
  T_in: 1
  T_out: 1
  
  # 时间步配置
  time_step_start: 0
  time_step_end: 101   
  time_step_stride: 10 
  
  observation:
    mode: SR
    sr:
      scale_factor: 4
      blur_sigma: 1.0
      blur_kernel_size: 5
      boundary_mode: mirror
      downsample_mode: area
      align_corners: false
      antialias: true
  
  dataloader:
    batch_size: 16 # 加大 batch size，因为 T=1 省显存
    num_workers: 8

# 使用标准 EDSR 模型
model:
  name: EDSR
  in_channels: 1
  out_channels: 1
  img_size: 128
  n_feats: 64
  n_resblocks: 32
  res_scale: 0.1
  upscale: 1

training:
  epochs: 100
  batch_size: 16
  gradient_accumulation_steps: 1
  gradient_clip_val: 1.0

  amp:
    enabled: true
    autocast_dtype: bfloat16
  
  degradation:
    mode: sr
    sr:
      scale_factor: 4
      blur_sigma: 1.0
      blur_kernel_size: 5
      boundary_mode: mirror
      downsample_mode: area
      align_corners: false
      antialias: true

  loss_weights:
    reconstruction: 1.0
    spectral: 0.5 # 修正为 0.5
    data_consistency: 1.0

  optimizer:
    name: "AdamW"
    lr: 0.0005 # 修正为 0.0005
    weight_decay: 0.0001
    
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 300
    eta_min: 1e-6
    warmup_epochs: 10

validation:
  check_val_every_n_epoch: 5
  metrics:
    - rel_l2
    - mae
    - psnr
    - ssim

logging:
  experiment_name: "AR-DR2D-Stage1-EDSR-SRx4"
  visualization:
    save_samples_every_n_epochs: 50
    num_samples_to_save: 5

testing:
  enabled: true
  run_final_test: true
  save_predictions: false
  compute_detailed_metrics: true
  batch_size: 512
  save_visualizations: true
  num_visualization_samples: 3
  fast_mode: false
  minimal_logging: false