# @package data

# 时序 PDEBench 数据配置
_target_: datasets.temporal_pdebench.TemporalPDEBenchDataModule

# 数据路径配置
data_path: "data/DR2D/2D_diff-react_NA_NA.h5"
dataset_name: "2D_diff-react"
splits_dir: "splits"

# 数据键名
keys: ["data"]

# 图像分辨率
image_size: 128
use_official_format: false

# 切分配置
train_split: "train"
val_split: "val"
test_split: "test"

# 观测模式配置
observation:
  mode: "SR"
  sr:
    scale_factor: 4
    blur_sigma: 1.0
    blur_kernel_size: 5
    boundary_mode: "mirror"
    noise_std: 0.0
  crop:
    crop_size: [64, 64]
    patch_align: 8
    crop_strategy: "mixed"
    boundary_mode: "mirror"

# 数据加载器配置
dataloader:
  batch_size: 4
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2

# 归一化配置
normalize: true
data_dir: "data/DR2D"

# 兼容参数
params:
  batch_size: 4
