# 真实扩散-反应数据训练配置
# 实验名称：Real-DR2D-AR-T20-128-SwinUNet-s2025

experiment:
  name: "Real-DR2D-AR-T20-128-SwinUNet-s2025"
  description: "真实扩散-反应数据训练，基于PDEBench 2D Diffusion-Reaction数据集"
  device: "cpu"
  seed: 2025
  output_dir: "runs"
  tags: ["real_data", "diffusion_reaction", "PDEBench", "SwinUNet"]

data:
  dataset_name: "RealDiffusionReaction2D"
  data_path: "data/DR2D/2D_diff-react_NA_NA.h5"
  
  # 数据参数
  img_size: 128
  channels: 2  # u和v两个变量
  keys: ["0000", "0001", "0002", "0003", "0004", "0005", "0006", "0007", "0008", "0009"]  # 使用前10个样本
  
  # 时序配置
  T_in: 1      # 输入时间步数
  T_out: 20    # 输出时间步数（目标：预测20步）
  time_step_start: 0
  time_step_end: 80  # 使用前80个时间步
  time_step_stride: 1
  
  # 数据切分
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  
  # 数据增强
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotate_prob: 0.3
    noise_std: 0.01
  
  # 数据预处理
  preprocessing:
    normalize: true
    cache_data: false
  
  # 数据加载器
  dataloader:
    batch_size: 4
    num_workers: 4
    pin_memory: true
    persistent_workers: true

model:
  name: "SwinUNet"
  params:
    in_channels: 2
    out_channels: 2
    img_size: 128
    kwargs:
      patch_size: 4
      window_size: 8
      depths: [2, 2, 6, 2]
      num_heads: [3, 6, 12, 24]
      embed_dim: 96
      mlp_ratio: 4.0
      drop_rate: 0.1
      attn_drop_rate: 0.0
      drop_path_rate: 0.1

training:
  epochs: 200
  optimizer:
    name: "AdamW"
    params:
      lr: 1e-3
      weight_decay: 1e-4
      betas: [0.9, 0.999]
  scheduler:
    name: "cosine_warmup"
    params:
      T_max: 200
      warmup_steps: 2000
      eta_min: 1e-6
  grad_clip_norm: 1.0
  mixed_precision: true
  log_interval: 10
  save_interval: 20
  validation:
    check_val_every_n_epoch: 10
  early_stopping:
    enabled: true
    patience: 30
    monitor: "val_rel_l2"
    mode: "min"

loss:
  rec_weight: 1.0
  spec_weight: 0.5
  dc_weight: 1.0
  rec_loss_type: "l2"
  spec_loss_type: "l2"
  dc_loss_type: "l2"
  low_freq_modes: 16
  use_gradient_loss: false
  gradient_weight: 0.1
  use_pde_residual_loss: false
  pde_residual_weight: 0.1

validation:
  metrics: ["rel_l2", "mae", "psnr", "ssim", "dc_error"]
  save_predictions: true
  max_predictions: 10

performance_monitoring:
  enabled: true
  report_interval_seconds: 60
  gpu_low_threshold: 0.90
  iowait_high_threshold: 0.12
  cpu_low_threshold: 0.80

logging:
  use_tensorboard: true
  log_level: "INFO"
  save_code_snapshot: true

visualization:
  enabled: true
  save_plots: true
  plot_interval: 50
  plot_types: ["prediction", "error", "spectrum"]

paper_package:
  enabled: true
  include_checkpoints: true
  include_visualizations: true
  include_metrics: true
  anonymize: false