# 真实扩散-反应数据AR训练配置
# 实验名称：Real-DR2D-AR-T20-128-SwinUNet-AR-s2025
# 遵循项目开发规范：
# - 一致性优先：观测算子与训练DC复用同一实现
# - 可复现：同一YAML+种子，验证指标方差≤1e-4
# - 统一接口：模型forward(x[B,C_in,H,W])→y[B,C_out,H,W]
# - 支持课程学习：分阶段预测（5→15→20步）
# - 完整监控：包含验证、可视化、论文包生成

experiment:
  name: "Real-DR2D-AR-T20-128-SwinUNet-AR-s2025"
  description: "真实扩散-反应数据AR训练，20步自回归预测，基于PDEBench 2D Diffusion-Reaction数据集"
  device: "cpu"  # 强制使用CPU，避免NVIDIA驱动问题
  seed: 2025
  seeds: [42, 123, 456]  # 多种子支持
  use_multi_seeds: false  # 默认单种子训练
  output_dir: "runs"
  tags: ["real_data", "diffusion_reaction", "PDEBench", "SwinUNet", "AR", "autoregressive", "T20"]
  precision: "32"  # CPU模式下使用32位精度

data:
  dataset_name: "RealDiffusionReaction2D"
  data_path: "data/DR2D/2D_diff-react_NA_NA.h5"
  
  # 数据参数
  img_size: 128
  channels: 2  # u和v两个变量
  keys: ["0000", "0001", "0002", "0003", "0004", "0005", "0006", "0007", "0008", "0009"]  # 使用前10个样本
  
  # 时序配置 - AR模式
  T_in: 1      # 输入时间步数
  T_out: 20    # 输出时间步数（目标：20步AR预测）
  time_step_start: 0
  time_step_end: 80  # 使用前80个时间步
  time_step_stride: 1
  
  # 数据切分
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  
  # 数据增强
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotate_prob: 0.3
    noise_std: 0.01
  
  # 数据预处理
  preprocessing:
    normalize: true
    cache_data: false
  
  # 数据加载器
  dataloader:
    batch_size: 4
    num_workers: 0  # CPU模式下禁用多进程
    pin_memory: false  # CPU模式下禁用
    persistent_workers: false  # CPU模式下禁用

model:
  name: "SwinUNet"
  params:
    in_channels: 2
    out_channels: 2
    img_size: 128
    kwargs:
      patch_size: 4
      window_size: 8
      depths: [2, 2, 6, 2]
      num_heads: [3, 6, 12, 24]
      embed_dim: 96
      mlp_ratio: 4.0
      drop_rate: 0.1
      attn_drop_rate: 0.0
      drop_path_rate: 0.1

# AR包装器配置
ar_wrapper:
  enabled: true
  T_out: 20  # AR预测步数
  teacher_forcing_ratio: 0.5  # 教师强制比例
  teacher_forcing_decay: 0.995  # 教师强制衰减
  use_ground_truth_ratio: 0.3  # 使用真值比例

# 课程学习配置（遵循开发文档规范）
curriculum:
  enabled: true
  stages:
    - epochs: 20
      T_out: 5
      description: "阶段1: 预测5步，建立基础空间特征"
      teacher_forcing_ratio: 0.8
    - epochs: 40
      T_out: 15
      description: "阶段2: 预测15步，增强时序建模"
      teacher_forcing_ratio: 0.6
    - epochs: 140
      T_out: 20
      description: "阶段3: 预测20步，完整AR能力"
      teacher_forcing_ratio: 0.3

training:
  epochs: 200
  optimizer:
    name: "AdamW"
    params:
      lr: 1e-3  # 遵循开发文档规范
      weight_decay: 1e-4
      betas: [0.9, 0.999]
  scheduler:
    name: "cosine_warmup"  # 遵循开发文档规范
    params:
      T_max: 200
      warmup_steps: 2000
      eta_min: 1e-6
  grad_clip_norm: 1.0  # 梯度裁剪，遵循开发文档
  mixed_precision: false  # CPU模式下禁用混合精度
  log_interval: 10
  save_interval: 20
  validation:
    check_val_every_n_epoch: 10
  early_stopping:
    enabled: true
    patience: 30  # 遵循开发文档规范
    monitor: "val_rel_l2"
    mode: "min"
    min_delta: 1e-4

# 损失函数配置（遵循开发文档三件套规范）
loss:
  rec_weight: 1.0      # 重建损失权重
  spec_weight: 0.5     # 频谱损失权重
  dc_weight: 1.0       # 数据一致性损失权重
  rec_loss_type: "l2"  # 重建损失类型
  spec_loss_type: "l2" # 频谱损失类型
  dc_loss_type: "l2"   # 数据一致性损失类型
  low_freq_modes: 16   # 低频模式数
  use_gradient_loss: false
  gradient_weight: 0.1
  use_pde_residual_loss: false
  pde_residual_weight: 0.1
  # AR特定损失
  ar_temporal_weight: 1.0  # 时序一致性权重
  ar_accumulation_weight: 0.5  # 累积误差权重

# 观测算子配置（遵循开发文档一致性要求）
observation:
  mode: "sr"  # 超分辨率模式
  scale_factor: 2
  blur_sigma: 1.0  # 高斯模糊sigma
  kernel_size: 5   # 核大小（奇数）
  boundary: "mirror"  # 边界处理策略
  downsample_interpolation: "area"  # 下采样插值方法
  crop_size: null
  crop_box: null

validation:
  metrics: ["rel_l2", "mae", "psnr", "ssim", "dc_error", "ar_temporal_error", "long_term_stability"]
  save_predictions: true
  max_predictions: 10
  # AR验证特定
  ar_validation_steps: 20  # AR验证步数
  ar_ground_truth_interval: 5  # 真值验证间隔

performance_monitoring:
  enabled: true
  report_interval_seconds: 60
  gpu_low_threshold: 0.90
  iowait_high_threshold: 0.12
  cpu_low_threshold: 0.80

logging:
  use_tensorboard: true
  log_level: "INFO"
  save_code_snapshot: true
  # AR训练特定日志
  log_ar_metrics: true
  log_teacher_forcing_ratio: true

visualization:
  enabled: true
  save_plots: true
  plot_interval: 50
  plot_types: ["prediction", "error", "spectrum", "ar_trajectory", "temporal_evolution"]
  # AR可视化特定
  ar_trajectory_plot: true
  temporal_evolution_plot: true
  max_visualization_samples: 3

paper_package:
  enabled: true
  include_checkpoints: true
  include_visualizations: true
  include_metrics: true
  anonymize: false
  # AR特定包内容
  include_ar_trajectories: true
  include_temporal_analysis: true

# 硬件配置（CPU模式）
hardware:
  allow_tf32: false  # CPU模式下禁用TF32
  deterministic: true  # 确定性计算确保可复现
  benchmark: false  # CPU模式下禁用cudnn benchmark

# 分布式训练配置（CPU模式下禁用）
distributed:
  enabled: false
  backend: "gloo"  # CPU后端
  world_size: 1
  rank: 0
  local_rank: 0