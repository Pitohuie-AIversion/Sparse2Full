# 1000样本测试配置文件
# 基于train.yaml，用于验证训练流程稳定性

defaults:
  - _self_

# 实验配置
experiment:
  name: "pdebench_sr_x4_1k_test"
  device: "cuda:0"
  seed: 2025
  output_dir: "runs"

# 数据配置
data:
  data_path: "data/2D/DarcyFlow/2D_DarcyFlow_beta1.0_Train.hdf5"
  dataset_name: "PDEBench"
  keys: ["tensor"]  # 数据变量键名
  splits_dir: "splits"
  image_size: 128
  sample_limit: 1000  # 限制使用1000个样本
  
  # 观测配置
  observation:
    mode: "SR"  # SR (超分辨率) 或 Crop (裁剪)
    sr:
      scale_factor: 4
      blur_sigma: 1.0
      blur_kernel_size: 5
      boundary_mode: "mirror"
    crop:
      crop_size: [64, 64]
      crop_strategy: "uniform"  # uniform, boundary, high_gradient
      boundary_mode: "mirror"
  
  # 预处理配置
  preprocessing:
    normalize: true
    cache_data: false
  
  # 数据加载器配置
  dataloader:
    batch_size: 2  # 减小批次大小以节省内存
    num_workers: 2  # 减少工作进程
    pin_memory: true
    persistent_workers: false  # 禁用持久化工作进程

# 模型配置
model:
  name: "SwinUNet"  # SwinUNet, Hybrid, MLP
  params:
    in_channels: 2  # 修改为2通道以匹配数据
    out_channels: 2  # 修改为2通道以匹配数据
    img_size: 128
    kwargs:
      # SwinUNet特定参数
      patch_size: 4
      window_size: 8
      depths: [2, 2, 6, 2]
      num_heads: [3, 6, 12, 24]
      embed_dim: 96
      mlp_ratio: 4.0
      drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.1

# 训练配置
training:
  epochs: 10  # 减少epoch数量用于快速测试
  optimizer:
    name: "adamw"
    lr: 0.0001  # 降低学习率
    weight_decay: 0.01
    betas: [0.9, 0.999]
  
  scheduler:
    name: "cosine"
    T_max: 10
    eta_min: 0.00001
    warmup_epochs: 2
    warmup_start_factor: 0.1
  
  # 梯度裁剪
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  
  # 混合精度训练
  amp:
    enabled: true
    opt_level: "O1"
  
  # 检查点配置
  checkpoint:
    save_best: true
    save_last: true
    max_keep: 3
    monitor: "val_loss"
    mode: "min"
  
  # 早停配置
  early_stopping:
    enabled: true
    patience: 5
    monitor: "val_loss"
    mode: "min"
  
  # 数据一致性验证
  verify_data_consistency: true

# 损失函数配置
loss:
  reconstruction:
    weight: 1.0
  spectral:
    weight: 0.1
  degradation_consistency:
    weight: 1.0
  gradient_weight: 0.0
  pde_residual_weight: 0.0
  pde_low_freq_weight: 2.0

# 验证配置
validation:
  batch_size: 4  # 适中验证批次大小
  metrics:
    - "rel_l2"
    - "mae" 
    - "psnr"
    - "ssim"
    - "frmse_low"
    - "frmse_mid"
    - "frmse_high"

# 设备配置
device:
  use_cuda: true
  cuda_device: 0
  num_workers: 2
  pin_memory: true

# 日志配置
logging:
  level: "INFO"
  use_tensorboard: true
  use_wandb: false
  wandb_project: "pdebench-sparse2full"
  
# 可复现性配置
reproducibility:
  deterministic: true
  benchmark: false