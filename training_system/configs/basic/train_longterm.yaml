# 长期训练配置 - 基于收敛标准的扩展训练
# 实验配置
experiment:
  name: "LongTerm-DR2D-SwinUNet-Convergence-s2025"
  device: cuda:0
  seed: 2025
  output_dir: runs

# 数据配置 - 扩展到更大数据集
data:
  data_path: "data/2D/DarcyFlow/2D_DarcyFlow_beta1.0_Train.hdf5"
  dataset_name: "PDEBench"
  keys: ["tensor"]  # 单通道数据
  splits_dir: "splits"
  image_size: 128
  sample_limit: 10000  # 扩展到10K样本
  
  # 观测模式配置
  observation:
    mode: "SR"  # 超分辨率任务
    sr:
      scale_factor: 2
      blur_sigma: 1.0
      blur_kernel_size: 5
      boundary_mode: "mirror"
    crop:
      crop_size: [64, 64]
      crop_strategy: "uniform"
      boundary_mode: "mirror"
  
  # 预处理配置
  preprocessing:
    normalize: true
    cache_data: false
  
  # 数据加载器配置
  dataloader:
    batch_size: 4  # 增加批次大小
    num_workers: 4
    pin_memory: true
    persistent_workers: true

# 模型配置
model:
  name: "SwinUNet"
  params:
    in_channels: 5  # baseline(2) + coords(2) + mask(1) = 5通道
    out_channels: 2  # 目标数据是2通道
    img_size: 128
    kwargs:
      patch_size: 4
      window_size: 8
      depths: [2, 2, 6, 2]
      num_heads: [3, 6, 12, 24]
      mlp_ratio: 4.0
      drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.1

# 训练配置 - 长期训练设置
training:
  epochs: 200  # 增加到200个epoch
  
  # 优化器配置
  optimizer:
    name: "adamw"
    lr: 1e-3
    weight_decay: 1e-4
    betas: [0.9, 0.999]
  
  # 学习率调度器配置
  scheduler:
    name: "reduce_lr_on_plateau"
    mode: "min"
    factor: 0.5  # 学习率减半
    patience: 15  # 15个epoch无改善则降低学习率
    min_lr: 1e-6
    threshold: 1e-4
    threshold_mode: "rel"
    cooldown: 5
    verbose: true
  
  # 梯度裁剪
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  
  # 混合精度训练
  amp:
    enabled: true
    opt_level: "O1"
  
  # 检查点配置
  checkpoint:
    save_best: true
    save_last: true
    max_keep: 5
    monitor: "val_loss"
    mode: "min"
  
  # 早停配置
  early_stopping:
    enabled: true
    patience: 30  # 30个epoch无改善则停止
    monitor: "val_loss"
    mode: "min"
    min_delta: 1e-4  # 最小改善阈值
  
  # 数据一致性验证
  verify_data_consistency: true

# 损失函数配置
loss:
  reconstruction:
    weight: 1.0
  spectral:
    weight: 0.1
  degradation_consistency:
    weight: 1.0
  gradient_weight: 0.0
  pde_residual_weight: 0.0
  pde_low_freq_weight: 2.0

# 验证和评估配置
validation:
  metrics:
    - "rel_l2"
    - "mae" 
    - "psnr"
    - "ssim"
    - "frmse_low"
    - "frmse_mid"
    - "frmse_high"
    - "brmse"
    - "crmse"
  
  # 收敛标准
  convergence_criteria:
    target_rel_l2: 0.1  # 目标相对L2误差
    patience_for_convergence: 20  # 连续20轮无显著改善
    min_improvement: 1e-4  # 最小改善阈值
    overfitting_threshold: 0.1  # 训练/验证损失差距阈值

# 设备和性能配置
device:
  accelerator: "gpu"
  devices: 1
  precision: 16  # 混合精度训练
  
# 日志和可视化配置
logging:
  experiment_name: "LongTerm-DR2D-SwinUNet-Convergence-s2025"
  version: null
  default_hp_metric: false
  log_model: true
  
  # TensorBoard配置
  tensorboard:
    save_dir: "runs/tensorboard"
    name: "longterm_training"
    version: null
  
  # 可视化配置
  visualization:
    save_samples_every_n_epochs: 10
    num_samples_to_save: 5
    save_training_curves: true

# 随机种子
seed: 2025

# Hydra配置
defaults:
  - _self_

hydra:
  job:
    chdir: false