# 基准测试训练配置 - 用于性能对比
experiment:
  name: "benchmark-training"
  device: "cuda"
  seed: 42
  output_dir: "runs"

benchmark:
  models:
    - name: "SwinUNet"
      config:
        model:
          name: "SwinUNet"
          params:
            in_channels: 1
            out_channels: 1
            img_size: 256
            kwargs:
              patch_size: 4
              window_size: 8
              depths: [2, 2, 2, 2]
              num_heads: [4, 8, 16, 32]
              embed_dim: 96
              mlp_ratio: 4.0
    
    - name: "SwinTemporalNAR"
      config:
        model:
          name: "SwinTemporalNAR"
          params:
            in_channels: 1
            out_channels: 1
            img_size: 256
            kwargs:
              depths: [2, 2, 2, 2]
              num_heads: [4, 8, 16, 32]
              embed_dim: 96
              window_size: 8
    
    - name: "UNet"
      config:
        model:
          name: "UNet"
          params:
            in_channels: 1
            out_channels: 1
            base_channels: 64
            depth: 4
  
  observations:
    - name: "SRx2"
      config:
        data:
          observation:
            mode: "SR"
            scale: 2
            sigma: 1.0
            kernel_size: 5
    
    - name: "SRx4"
      config:
        data:
          observation:
            mode: "SR"
            scale: 4
            sigma: 1.0
            kernel_size: 5
    
    - name: "Crop40"
      config:
        data:
          observation:
            mode: "Crop"
            crop_ratio: 0.4
            crop_strategy: "uniform"
    
    - name: "Crop20"
      config:
        data:
          observation:
            mode: "Crop"
            crop_ratio: 0.2
            crop_strategy: "gradient_weighted"
  
  loss_configs:
    - name: "Standard"
      config:
        loss:
          rec_weight: 1.0
          spec_weight: 0.5
          dc_weight: 1.0
    
    - name: "NoSpectral"
      config:
        loss:
          rec_weight: 1.0
          spec_weight: 0.0
          dc_weight: 1.0
    
    - name: "NoDC"
      config:
        loss:
          rec_weight: 1.0
          spec_weight: 0.5
          dc_weight: 0.0
  
  seeds: [42, 123, 456]
  epochs_per_config: 50
  output_format: "paper_package"

data:
  data_path: "datasets/PDEBench"
  keys: ["u"]
  image_size: 256
  preprocessing:
    normalize: true
    cache_data: false
  dataloader:
    batch_size: 8
    num_workers: 4
    pin_memory: true
    persistent_workers: true

training:
  epochs: 50
  optimizer:
    name: "AdamW"
    params:
      lr: 1e-3
      weight_decay: 1e-4
      betas: [0.9, 0.999]
  scheduler:
    name: "cosine_warmup"
    params:
      T_max: 50
      warmup_steps: 500
      eta_min: 1e-6
  grad_clip_norm: 1.0
  log_interval: 10
  save_interval: 10
  validation:
    check_val_every_n_epoch: 5
  early_stopping:
    enabled: true
    patience: 15

validation:
  metrics: ["rel_l2", "mae", "psnr", "ssim", "dc_error", "frmse_low", "frmse_mid", "frmse_high", "brmse"]

performance_monitoring:
  enabled: true
  report_interval_seconds: 30
  gpu_low_threshold: 0.90
  iowait_high_threshold: 0.12
  cpu_low_threshold: 0.80

logging:
  use_tensorboard: true
  log_level: "INFO"

visualization:
  enabled: true
  save_plots: true
  plot_interval: 25

paper_package:
  enabled: true
  include_checkpoints: true
  include_visualizations: true