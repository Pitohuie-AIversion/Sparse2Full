# 真实扩散-反应数据训练配置（本地路径模板）
# 实验名：Real-DR2D-AR-T20-128-SwinUNet-local

experiment:
  name: "Real-DR2D-AR-T20-128-SwinUNet-local"
  device: "cpu"
  seed: 2025
  output_dir: "runs"

data:
  dataset_name: "RealDiffusionReaction2D"
  # 请将下方 data_path 替换为您真实数据的 .h5 文件路径
  data_path: "/path/to/your/2D_diff-react_NA_NA.h5"

  # 数据参数
  img_size: 128
  channels: 2
  # 可选：指定样本键（如 '0000','0001'...），不指定则由模块自动遍历 keys
  keys: []

  # 时序配置
  T_in: 1
  T_out: 20
  time_step_start: 0
  time_step_end: 80
  time_step_stride: 1

  # 数据切分
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

  # 数据增强
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotate_prob: 0.3
    noise_std: 0.0

  # 预处理
  preprocessing:
    normalize: true
    cache_data: false

  # DataLoader（与 hardware 兼容读取）
  dataloader:
    batch_size: 2
    num_workers: 0
    pin_memory: false
    persistent_workers: false

model:
  name: "SwinUNet"
  params:
    in_channels: 2
    out_channels: 2
    img_size: 128
    kwargs:
      patch_size: 4
      window_size: 8
      depths: [2, 2, 6, 2]
      num_heads: [3, 6, 12, 24]
      embed_dim: 96
      mlp_ratio: 4.0
      drop_rate: 0.0
      attn_drop_rate: 0.0
      drop_path_rate: 0.1

training:
  epochs: 1  # 先做就绪性短训
  batch_size: 2
  optimizer:
    name: "AdamW"
    params:
      lr: 1e-3
      weight_decay: 1e-4
      betas: [0.9, 0.999]
  scheduler:
    name: "cosine_warmup"
    params:
      T_max: 50
      warmup_steps: 1000
      eta_min: 1e-6
  grad_clip_norm: 1.0
  mixed_precision: false
  log_interval: 10
  save_interval: 1

loss:
  rec_weight: 1.0
  spec_weight: 0.0
  dc_weight: 0.0
  rec_loss_type: "l2"
  low_freq_modes: 4

validation:
  metrics: ["rel_l2", "mae", "psnr", "ssim"]
  save_predictions: false
  max_predictions: 0

hardware:
  num_workers: 0
  pin_memory: false
  persistent_workers: false

logging:
  use_tensorboard: false
  log_level: "INFO"

visualization:
  enabled: false