experiment:
  name: Resource-Persistence-Test-model_SwinUNet-s2025-20260904
  description: 最小配置测试训练流程
  device: cuda:0
  seed: 2025
  output_dir: /tmp/resource_persist_llv9m3p0
  precision: bf16-mixed
device:
  accelerator: cuda
  devices: 1
  strategy: auto
  precision: bf16-mixed
ar:
  enabled: false
sequential:
  enabled: false
data:
  dataset_name: RealDiffusionReaction
  data_path: /tmp/synthetic_data.h5
  use_synthetic_data: true
  synthetic_data_config:
    num_samples: 16
    image_size: 64
    channels: 2
  T_in: 1
  T_out: 1
  image_size: 64
  sample_limit: 50
  train_ratio: 0.8
  val_ratio: 0.15
  test_ratio: 0.05
  normalize: true
  augmentation:
    enabled: false
  dataloader:
    batch_size: 4
    val_batch_size: 2
    test_batch_size: 1
    num_workers: 0
    pin_memory: false
    persistent_workers: true
    prefetch_factor: 16
    drop_last: true
    shuffle: false
  max_samples: 512
model:
  name: SwinUNet
  in_channels: 2
  out_channels: 2
  img_size: 64
  patch_size: 2
  window_size: 4
  depths:
  - 1
  - 1
  - 1
  - 1
  num_heads:
  - 1
  - 2
  - 4
  - 8
  embed_dim: 24
  mlp_ratio: 2.0
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.0
training:
  epochs: 2
  batch_size: 4
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    lr: 0.001
    weight_decay: 0.0
    fused: false
    foreach: false
  scheduler:
    name: CosineAnnealingLR
    T_max: 2
    eta_min: 1.0e-06
  gradient_clip_val: 0
  amp:
    enabled: true
    autocast_dtype: bfloat16
  validation:
    enabled: true
    check_val_every_n_epoch: 1
    log_val_metrics: false
  checkpoint:
    save_best: false
    save_last: false
    max_keep: 2
    save_every_n_epochs: 0
  early_stopping:
    enabled: false
    patience: 20
    min_delta: 0.0001
    monitor: val_loss
loss:
  reconstruction:
    weight: 1.0
  spectral:
    weight: 0.0
  degradation_consistency:
    weight: 0.0
  gradient_weight: 0.0
logging:
  experiment_name: minimal-debug
  log_every_n_steps: 1
  performance_monitoring:
    log_gpu_memory: false
    log_throughput: false
    log_batch_time: false
  tensorboard:
    save_dir: runs/tensorboard
    name: minimal_debug
  visualization:
    save_samples_every_n_epochs: 0
    num_samples_to_save: 0
    save_training_curves: false
testing:
  enabled: false
data_augmentation:
  enable: false
seed: 2025
hardware:
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  allow_tf32: true
