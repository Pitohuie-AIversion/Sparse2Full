  data_consistency:
    weight: 0.0
  mae_weight: 0.0
  r2:
    reduction: mean
    weight: 0.0
  rel2_weight: 1.0
  spectral:
    weight: 0.0
model_wrapper:
  enabled: false
seed: 2025
sequential:
  consistency:
    enabled: true
    feature_consistency_weight: 0.3
    spatial_temporal_consistency: true
  enabled: true
  model_type: SequentialSpatiotemporalModel
  spatial:
    backbone_config:
      activation: gelu
      modes1: 12
      modes2: 12
      n_layers: 4
      width: 64
    backbone_type: identity
    img_size:
    - 128
    - 128
    in_channels: 1
    out_channels: 1
    spatial_feature_dim: 0
  temporal:
    backend: video_swin
    dropout: 0.1
    hidden_dim: 96
    img_size:
    - 128
    - 128
    num_heads: 4
    num_layers: 2
    out_channels: 1
    reduce_size:
    - 128
    - 128
    reduce_spatial: null
    spatial_feature_dim: 0
    teacher_forcing_cap: 0.0
    teacher_forcing_schedule:
      enabled: false
    temporal_dim: 96
    use_positional_encoding: false
    window_size:
    - 2
    - 7
    - 7
  training:
    spatial_loss_weight: 0.0
    stage1_epochs: 0
    stage2_epochs: 2000
    teacher_forcing_cap: 0.2
    temporal_loss_weight: 1.0
    two_stage_training: false
testing:
  batch_size: 32
  compute_detailed_metrics: false
  enabled: true
  fast_mode: false
  minimal_logging: false
  num_visualization_samples: 2
  run_final_test: true
  save_predictions: false
  save_visualizations: true
  skip_complex_metrics: false
training:
  amp:
    autocast_dtype: bfloat16
    enabled: true
  batch_size: 32
  channels_last: true
  checkpoint:
    max_keep: 3
    mode: min
    monitor: val_loss
    save_best: true
    save_every_n_epochs: 10
    save_last: true
  curriculum:
    enabled: false
  dataloader:
    batch_size: 32
  distributed:
    backend: nccl
    enabled: false
    init_method: env://
  early_stopping:
    enabled: false
    min_delta: 0.0001
    mode: min
    monitor: val_loss
    patience: 50
  epochs: 200
  gradient_accumulation_steps: 1
  gradient_clip_algorithm: norm
  gradient_clip_val: 1.0
  loss:
    mae_weight: 0.1
    rel2_weight: 1.0
  loss_weights:
    data_consistency: 0.0
    derivative_consistency: 0.0
    energy_consistency: 0.0
    reconstruction: 1.0
    spectral: 0.02
  optimizer:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    foreach: false
    fused: false
    lr: 0.001
    name: AdamW
    weight_decay: 0.0001
  rollout_training: true
  scheduler:
    T_max: 200
    eta_min: 1.0e-06
    name: CosineAnnealingLR
    warmup_epochs: 5
  teacher_forcing_cap: 0.7
  teacher_forcing_schedule:
    enabled: true
    end_cap: 0.4
    end_epoch: 20
    start_cap: 0.7
    start_epoch: 1
  torch_compile: false
  torch_compile_backend: inductor
  torch_compile_mode: reduce-overhead
  validation:
    check_val_every_n_epoch: 1
    enabled: true
    log_val_metrics: true
    save_val_batch_for_viz: false
validation:
  check_val_every_n_epoch: 5
  convergence_criteria:
    min_improvement: 0.0005
    patience_for_convergence: 5
    target_rel_l2: 0.3
  metrics:
  - rel_l2
  - mae
  - degradation_consistency
  rollout_steps:
  - 1
  - 3
  - 5
  use_observation: false
