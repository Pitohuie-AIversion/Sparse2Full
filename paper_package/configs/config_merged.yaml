experiment:
  name: expA_fewshot_drd-model_edsr-s2025-20260323
  description: 跨方程泛化性测试 - Few-shot SWE pretrained model on DRD
  device: cuda
  seed: 2025
  output_dir: runs/expA_fewshot_drd
  precision: bf16-mixed
device:
  accelerator: cuda
  devices: 1
  precision: bf16-mixed
ar:
  enabled: false
data:
  data_path: data/DR2D/2D_diff-react_NA_NA.h5
  dataset_name: RealDiffusionReaction
  img_size: 128
  keys:
  - data
  component: u
  use_official_format: true
  splits_dir: splits
  target_channels: 1
  input_channels: 1
  T_in: 1
  T_out: 1
  train_ratio: 0.1
  val_ratio: 0.25
  test_ratio: 0.25
  time_step_start: 0
  time_step_end: 101
  time_step_stride: 10
  observation:
    mode: SR
    sr:
      scale_factor: 4
      blur_sigma: 1.0
      blur_kernel_size: 5
      boundary_mode: mirror
      downsample_mode: area
      align_corners: false
      antialias: true
  dataloader:
    batch_size: 16
    num_workers: 4
    val_batch_size: 16
    test_batch_size: 16
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true
    shuffle: true
  max_samples: 512
model:
  name: edsr
  in_channels: 1
  out_channels: 1
  img_size: 128
  modes1: 16
  modes2: 16
  width: 48
  n_layers: 4
  activation: gelu
  padding: 8
pretrained_path: runs/AR-SW-10M-edsr/best.ckpt
training:
  epochs: 10
  batch_size: 16
  gradient_clip_val: 1.0
  amp:
    enabled: true
    autocast_dtype: bfloat16
  loss_weights:
    reconstruction: 1.0
    spectral: 0.5
    data_consistency: 1.0
  optimizer:
    name: AdamW
    lr: 0.0001
    weight_decay: 0.0001
  scheduler:
    name: CosineAnnealingLR
    T_max: 50
    eta_min: 1.0e-06
    warmup_epochs: 5
  checkpoint:
    save_best: true
    monitor: val_loss
    mode: min
    max_keep: 2
    save_every_n_epochs: 0
  early_stopping:
    enabled: true
    patience: 50
    min_delta: 0.0001
    monitor: val_loss
testing:
  enabled: true
  run_final_test: true
  save_predictions: false
  compute_detailed_metrics: true
  batch_size: 16
  save_visualizations: false
  num_visualization_samples: 3
validation:
  check_val_every_n_epoch: 5
  use_observation: true
  metrics:
  - rel_l2
  - mae
  - psnr
  - ssim
hardware:
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  allow_tf32: true
