
# 临时训练配置 - UNet模型
defaults:
  - _self_

# 最小数据配置
data:
  dataset_name: RealDiffusionReaction
  data_path: "datasets/sample_data.hdf5"  # 使用实际数据文件
  use_synthetic_data: false  # 使用真实数据
  
  T_in: 1
  T_out: 1
  image_size: 128
  sample_limit: 50
  
  train_ratio: 0.8
  val_ratio: 0.15
  test_ratio: 0.05
  
  normalize: true
  augmentation:
    enabled: false
  
  # 数据加载器配置
  dataloader:
    batch_size: 4
    val_batch_size: 4
    test_batch_size: 1
    num_workers: 0   # 禁用多进程
    pin_memory: false
    persistent_workers: false
    prefetch_factor: 2
    drop_last: true
    shuffle: true

# 模型配置
model:
  name: unet
  in_channels: 1
  out_channels: 1
  img_size: 128


# 训练配置
training:
  epochs: 5
  batch_size: 4
  torch_compile: false
  
  # 优化器配置
  optimizer:
    name: "AdamW"
    lr: 0.001
    weight_decay: 0.0
    fused: false
    foreach: false
  
  # 调度器配置
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 5
    eta_min: 1e-6
  
  # 基本设置
  gradient_clip_val: 0
  
  # AMP配置
  amp:
    enabled: true
    autocast_dtype: bfloat16
  
  # 验证配置
  validation:
    enabled: true
    check_val_every_n_epoch: 1
    log_val_metrics: false
  
  # 检查点配置
  checkpoint:
    save_best: false
    save_last: false
    max_keep: 1
  
  # 禁用早停
  early_stopping:
    enabled: false

# 损失配置
loss:
  reconstruction:
    weight: 1.0
  spectral:
    weight: 0.0
  degradation_consistency:
    weight: 0.0
  gradient_weight: 0.0

# 日志配置
logging:
  experiment_name: "unet_quick_train"
  log_every_n_steps: 1
  performance_monitoring:
    log_gpu_memory: false
    log_throughput: false
    log_batch_time: false
  tensorboard:
    save_dir: runs/tensorboard
    name: unet_quick_train
  visualization:
    save_samples_every_n_epochs: 0
    num_samples_to_save: 0
    save_training_curves: false

# 测试配置
testing:
  enabled: false

# 禁用数据增强
data_augmentation:
  enable: false

# 随机种子
seed: 2025

# 实验配置
experiment:
  precision: 16-mixed
  name: unet_quick_train
  output_dir: runs
  device: cuda:0
  seed: 2025
