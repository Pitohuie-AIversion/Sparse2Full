# 简化UNet训练配置
data:
  use_synthetic_data: true
  T_in: 1
  T_out: 1
  channels: 1
  img_size: 128
  dataloader:
    batch_size: 4
    val_batch_size: 4
    test_batch_size: 1
    num_workers: 0
    pin_memory: false
    persistent_workers: false
    prefetch_factor: null
    drop_last: true
    shuffle: true

model:
  name: unet
  in_channels: 1
  out_channels: 1
  img_size: 128

training:
  epochs: 5
  batch_size: 4
  torch_compile: false
  optimizer:
    name: AdamW
    lr: 0.001
    weight_decay: 0.0
  scheduler:
    name: CosineAnnealingLR
    T_max: 5
    eta_min: 1.0e-06
  amp:
    enabled: true
    autocast_dtype: bfloat16
  validation:
    enabled: true
    check_val_every_n_epoch: 1

experiment:
  precision: 16-mixed
  name: unet_demo_train
  output_dir: runs
  device: cuda:0
  seed: 2025